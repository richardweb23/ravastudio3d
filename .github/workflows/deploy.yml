name: Publicar no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar configuração do Supabase
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || {
            echo "Cadastre o secret VITE_SUPABASE_URL."
            exit 1
          }
          VITE_SUPABASE_BROWSER_KEY="${VITE_SUPABASE_PUBLISHABLE_KEY:-${VITE_SUPABASE_ANON_KEY:-}}"
          test -n "$VITE_SUPABASE_BROWSER_KEY" || {
            echo "Cadastre VITE_SUPABASE_PUBLISHABLE_KEY ou VITE_SUPABASE_ANON_KEY."
            exit 1
          }

      - name: Gerar build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Validar artefato de produção
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/gestao/index.html
          test -f dist/CNAME
          test "$(cat dist/CNAME)" = "ravastudio3d.com.br"
          if grep -R 'src="/src/' dist/*.html dist/gestao/*.html; then
            echo "O artefato ainda referencia arquivos-fonte em /src."
            exit 1
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Preparar arquivos
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
